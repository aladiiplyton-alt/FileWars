<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Share — Комната не найдена</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 48px;
      max-width: 400px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #1a1a1a; font-size: 24px; margin-bottom: 12px; }
    p { color: #666; line-height: 1.6; margin-bottom: 24px; }
    .code { font-family: monospace; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; }
    a {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔍</div>
    <h1>Комната не найдена</h1>
    <p>Комната с кодом <span class="code" id="roomCode"></span> не существует или срок её действия истёк (24 часа).</p>
    <a href="/">Создать новую комнату</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || window.location.pathname.slice(1).toUpperCase();
    document.getElementById('roomCode').textContent = code;
  </script>
</body>
</html>
